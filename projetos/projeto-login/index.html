<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Login</title>

    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/medai-query.css">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=mail,password,user_attributes" />

</head>

<body>

    <main>

        <div id="imagem">
        </div>

        <div id="formulario">
            <h1>Login</h1>
            <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu
                ambiente.</p>
            <form action="" method="POST" autocomplete="on">


                <p class="campo">
                    <label for="email"><span class="material-symbols-outlined">user_attributes</span></label>
                    <input type="email" name="email" id="email" placeholder="  Digite seu e-mail..." required autocomplete="email" maxlength="30">
                </p>

                <p class="campo">  
                    <label for="pass"><span class="material-symbols-outlined">password</span></label>
                    <input type="password" name="pass" id="pass" placeholder=" Digite sua senha" required autocomplete="current-password" minlength="8" maxlength="20">
                </p>

                <input type="button" id="entrar" name="login" value="Entrar">
                <input type="button" id="resetSenha" name="login" value="Esqueci a senha" >
               
            </form>
        </div>
    </main>

</body>

</html>
