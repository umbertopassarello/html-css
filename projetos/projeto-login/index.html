<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Login</title>

    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/medai-query.css">

</head>
<body>
    
    <main>

        <div id="imagem">
        </div>

        <div id="formulario">
            <h1>Login</h1>
            <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
            <form action="" method="POST">
                <p class="campo">
                    <label for="email">IconUser</label>
                    <input type="email" name="email" id="email">
                </p>
            
                <p class="campo">
                    <label for="pass">IconPassword</label>
                    <input type="password" name="pass" id="pass">
                </p>
            
                <input type="button" id="entrar" name="login" value="Entrar">
                <input type="button" id="resetSenha" name="login" value="Esqueci a senha (icon email)">
            </form>
        </div>
    </main>

</body>
</html>
