<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        /* Flex direction: row (esq para dir), row-reverse, column (cima para baixo), column-reverse */

        /* Eixos:  main-axis - EIXO PRINCIPAL - VARIA DE ACORDO COM A DIREÇÃO ESCOLHIDA (main-start e main-end) e cross-axis - EIXO SECUNDARIO (cross-start e cross-end) */

        .container {
            background-color: salmon;
            display: flex;
        }

        .item {
            background-color: lightblue;
            border: 1px solid black;

            flex: auto;
            text-align: center;
        }

        body {
            background-color: lightgray;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
</body>
</html>
