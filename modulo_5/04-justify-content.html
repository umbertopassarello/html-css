<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        /* justify-content (eixo principal): 
            flex-start (alinha ao inicio do eixo principal)

            flex-end (alinha ao fim do eixo principal)

            center (alinha ao centro do eixo principal)

            space-between (distribui os itens com espaçamento igual entre eles)

            space-around (dividie o espaço do container pela quantidade de itens e alinha ao centro de cada partição)
             
            space-evenly (distribui os itens com espaçamento igual entre eles e nas extremidades) 
            ----------------------------------------------
            align-items (eixo transversal):

            stretch (PADRÃO) (estica os itens para preencher o container no eixo transversal)

            flex-start (alinha ao inicio do eixo transversal)

            flex-end (alinha ao fim do eixo transversal)

            center (alinha ao centro do eixo transversal)
            */

        .container {
            background-color: salmon;
            padding: 0px;
            height: 700px;
            margin: auto;

            display: flex;
            /* shorthand */
            flex-flow: row nowrap;
            justify-content: space-around;
            align-items: center;
        }

        .item {
            background-color: lightblue;
            border: 1px solid black;
            padding: 10px;
            text-align: center;

            /* flex-auto não permite que o container tenha espaços em branco */
        }

        body {
            background-color: lightgray;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">exemplo de bloco A</div>
        <div class="item">exemplo de bloco B</div>
        <div class="item">exemplo de bloco C</div>
        <div class="item">exemplo de bloco D</div>
        <div class="item">exemplo de bloco E</div>
        <div class="item">exemplo de bloco F</div>
        <div class="item">exemplo de bloco G</div>
    </div>
</body>
</html>
