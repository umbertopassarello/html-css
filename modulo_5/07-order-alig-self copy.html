<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        /* order: define a ordem dos itens no container flexível (padrão é 0, itens com valores menores aparecem primeiro) */

        /* align-self: alinhamento dos itens dentro do container (seguindo o eixo transversal) 
        
        em caso de não definição eles seguem o align-items do container pai
        */

        .container {
            background-color: salmon;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 700px;
        }

        .item {
            background-color: lightblue;
            border: 1px solid black;

            text-align: center;
            padding: 20px;
        }

        body {
            background-color: lightgray;
        }

        #i1{
            align-self: auto ;
        }
        #i2{
            align-self: flex-start;
        }
        #i3{
            align-self: flex-end ;
        }
        #i4{
            align-self: center;
        }
        #i5{
            align-self: stretch;
        }

        
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1" style="order: 1;">A</div>
        <div class="item" id="i2" style="order: 2;">B</div>
        <div class="item" id="i3" style="order: 3;">C</div>
        <div class="item" id="i4" style="order: 4;">D</div>
        <div class="item" id="i5" style="order: 5;">E</div>
        <div class="item" id="i6" style="order: 6;">F</div>
        <div class="item" id="i7" style="order: 7;">G</div>
    </div>
</body>
</html>
